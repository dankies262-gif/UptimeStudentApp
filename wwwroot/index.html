<!doctype html>
<html lang="en" data-theme="light" data-bs-theme="light">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Uptime Student App — timetable, calendar sync, assignments, budget and focus analytics for students. Built with ASP.NET Core, EF Core and Swagger.">
  <meta name="theme-color" content="#1747d1">
  <title>Uptime | Student Productivity</title>
  <link rel="icon" href="images/student-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="lib/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="css/site.css">
</head>

<div class="app-shell">
  <div class="scrim" id="scrim" onclick="closeDrawer()"></div>

  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#/dashboard" onclick="showPage('Dashboard');return false;">
      <img class="brand-mark" src="images/student-icon.svg" alt="">
      <span class="brand-text"><b>UPTIME</b><small>STUDENT APP</small></span>
    </a>

    <nav id="navigation" aria-label="Main navigation">
      <div class="nav-group">
        <p class="nav-label">Overview</p>
        <button class="nav-link" data-page="Dashboard"><svg class="ico"><use href="#i-grid"/></svg><span>Dashboard</span></button>
      </div>
      <div class="nav-group">
        <p class="nav-label">Plan</p>
        <button class="nav-link" data-page="Timetable"><svg class="ico"><use href="#i-week"/></svg><span>Timetable</span></button>
        <button class="nav-link" data-page="Calendar"><svg class="ico"><use href="#i-calendar"/></svg><span>Calendar</span></button>
        <button class="nav-link" data-page="Tasks"><svg class="ico"><use href="#i-check"/></svg><span>Tasks</span></button>
        <button class="nav-link" data-page="Assignment Helper"><svg class="ico"><use href="#i-wand"/></svg><span>Assignment Helper</span></button>
      </div>
      <div class="nav-group">
        <p class="nav-label">Student life</p>
        <button class="nav-link" data-page="Budget"><svg class="ico"><use href="#i-wallet"/></svg><span>Budget</span></button>
        <button class="nav-link" data-page="Study Timer"><svg class="ico"><use href="#i-timer"/></svg><span>Study Timer</span></button>
        <button class="nav-link" data-page="Alarms"><svg class="ico"><use href="#i-bell"/></svg><span>Alarms</span></button>
      </div>
      <div class="nav-group">
        <p class="nav-label">Learn</p>
        <button class="nav-link" data-page="Research Hub"><svg class="ico"><use href="#i-globe"/></svg><span>Research Hub</span></button>
        <button class="nav-link" data-page="Study Lab"><svg class="ico"><use href="#i-bulb"/></svg><span>Study Lab</span></button>
      </div>
      <div class="nav-group">
        <p class="nav-label">Build &amp; present</p>
        <button class="nav-link" data-page="Database"><svg class="ico"><use href="#i-database"/></svg><span>Database &amp; ERD</span></button>
        <button class="nav-link" data-page="API Workflow"><svg class="ico"><use href="#i-api"/></svg><span>API Workflow</span></button>
        <button class="nav-link" data-page="Presentation Kit"><svg class="ico"><use href="#i-present"/></svg><span>Presentation Kit</span></button>
        <button class="nav-link" data-page="Settings"><svg class="ico"><use href="#i-settings"/></svg><span>Settings</span></button>
      </div>
    </nav>

    <div class="sidebar-bottom">
      <span class="avatar" id="sideAvatar">U</span>
      <div class="sidebar-user">
        <b id="sideName">Student</b>
        <small id="sideInstitution">Your institution</small>
      </div>
    </div>
  </aside>

  <main class="main-area">
    <header class="topbar">
      <div class="topbar-left">
        <button class="icon-btn menu-btn" onclick="openDrawer()" aria-label="Open navigation">
          <svg class="ico"><use href="#i-menu"/></svg>
        </button>
        <div class="page-heading">
          <p class="eyebrow" id="pageEyebrow">YOUR PERSONAL STUDY SPACE</p>
          <h1 id="pageTitle">Dashboard</h1>
        </div>
      </div>
      <div class="top-actions">
        <button class="search-trigger" onclick="openCommandPalette()" aria-label="Search pages and actions">
          <svg class="ico"><use href="#i-search"/></svg>
          <span>Search or jump to…</span>
          <kbd>Ctrl K</kbd>
        </button>
        <span class="date-chip" id="todayLabel"></span>
        <button class="icon-btn" id="themeBtn" onclick="toggleTheme()" aria-label="Toggle colour theme">
          <svg class="ico theme-icon-sun"><use href="#i-sun"/></svg>
          <svg class="ico theme-icon-moon"><use href="#i-moon"/></svg>
        </button>
        <button class="profile-chip" onclick="showPage('Settings')" aria-label="Open profile settings">
          <span class="avatar avatar-sm" id="topAvatar">U</span>
          <span class="profile-chip-text"><b id="topName">Student</b><small id="topInstitution">Your institution</small></span>
        </button>
      </div>
    </header>

    <section id="content" class="content-area" aria-live="polite"></section>

    <footer class="app-footer">
      <div class="footer-brand"><img src="images/student-icon.svg" alt=""><b>UPTIME</b><span>Student App</span></div>
      <div class="footer-meta">
        <span class="health-pill" id="healthState"><i></i> Checking API…</span>
        <span>.NET 10 · SQL Server / PostgreSQL · Swagger</span>
        <span>Developed by <b>Reinhold IT Solutions</b> · © 2026</span>
      </div>
    </footer>
  </main>
</div>

<div id="toast" class="toast-message" role="status" aria-live="polite"></div>
<div id="modalRoot"></div>

<div class="palette" id="commandPalette" hidden>
  <div class="palette-scrim" onclick="closeCommandPalette()"></div>
  <div class="palette-card" role="dialog" aria-modal="true" aria-label="Command palette">
    <div class="palette-input">
      <svg class="ico"><use href="#i-search"/></svg>
      <input id="paletteInput" type="text" placeholder="Search pages and actions…" autocomplete="off" spellcheck="false">
      <kbd>Esc</kbd>
    </div>
    <div class="palette-list" id="paletteList"></div>
    <div class="palette-foot"><span>↑ ↓ navigate</span><span>↵ open</span><span>Esc close</span></div>
  </div>
</div>

<audio id="toneAudio" preload="auto"></audio>
<noscript><div class="noscript">Uptime needs JavaScript for its interactive dashboard.</div></noscript>
<script src="js/app.js"></script>
</body>
</html>
